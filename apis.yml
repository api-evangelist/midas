aid: midas
name: Midas
description: >-
  Midas is an onchain asset-management protocol that brings institutional-grade
  investment strategies onchain as tokenized real-world assets (RWAs). It issues
  permissionless, fully-backed tokenized products — including tokenized US
  Treasury bills (mTBILL), yield and basis strategies (mBASIS) and other
  onchain investment products — that offer full transparency, instant liquidity
  and native composability across DeFi. Investors mint and redeem Midas tokens
  directly against the underlying assets, and the resulting ERC-20 tokens can be
  used as collateral and as building blocks throughout the onchain economy.
  Positioned as "the standard for onchain investment products," Midas surfaced
  in the API Evangelist network as a fintech portfolio company for enrichment.
